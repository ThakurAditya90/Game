<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THAKUR ADITYA 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#87ceeb; font-family:'Arial Black', sans-serif; overflow:hidden; user-select:none; }
  #canvas-container { width:100vw; height:100vh; }
  
  /* Subway Surfers Style HUD */
  #hud {
    position:absolute; top:20px; left:20px; right:20px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none; z-index:10;
  }
  .score-box {
    background: linear-gradient(180deg, #38b6ff, #004aad);
    padding: 8px 20px; border-radius: 20px; border: 3px solid #fff;
    color:#fff; font-size:24px; text-shadow: 2px 2px #000;
    box-shadow: 0 5px 0 rgba(0,0,0,0.3);
  }
  .coin-box {
    background: linear-gradient(180deg, #ffde59, #ff914d);
    padding: 8px 20px; border-radius: 20px; border: 3px solid #fff;
    color:#fff; font-size:24px; text-shadow: 2px 2px #000;
    box-shadow: 0 5px 0 rgba(0,0,0,0.3);
  }

  /* Overlay UI */
  .overlay {
    position:absolute; inset:0; background:rgba(0,0,0,0.6);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; z-index:20;
  }
  .hidden { display:none !important; }
  h1 { font-size:48px; color:#ffde59; text-shadow:4px 4px #ff3131; margin-bottom:10px; text-align:center; }
  p { font-size:16px; margin-bottom:10px; color:#eee; text-align:center; max-width:80%; }
  
  button {
    background: linear-gradient(180deg, #ff3131, #ff914d);
    color:#fff; border:4px solid #fff; padding:15px 40px; font-size:24px;
    font-weight:bold; border-radius:30px; cursor:pointer; margin-top:20px;
    box-shadow:0 6px 0 #8b0000; text-shadow:2px 2px #000;
  }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #8b0000; }
</style>

<!-- Three.js Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="hud">
  <div class="score-box">SCORE: <span id="score">0</span></div>
  <div class="coin-box">🪙 <span id="coins">0</span></div>
</div>

<div id="startScreen" class="overlay">
  <h1>THAKUR ADITYA</h1>
  <p>Use LEFT/RIGHT arrows to change lanes, UP to Jump, DOWN to Slide!</p>
  <p style="color:#ffde59;"><b>Double-Click / Double-Tap for HOVERBOARD shield!</b></p>
  <button id="startBtn">PLAY NOW</button>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h1 style="color:#ff3131;">BUSTED!</h1>
  <p>Final Score: <span id="finalScore">0</span></p>
  <button id="restartBtn">TRY AGAIN</button>
</div>

<script>
// Sound Audio Elements
const crashSound = new Audio('crash.mp3');
const coinSound = new Audio('coin.mp3');

// Game State
let scene, camera, renderer;
let player, playerMesh, hoverboard;
let activeLane = 1; // 0: Left, 1: Center, 2: Right
const laneX = [-3.5, 0, 3.5];
let isJumping = false, jumpVelocity = 0;
let isSliding = false, slideTimer = 0;
let isHovering = false, hoverTimer = 0;
let isPlaying = false;
let score = 0, coins = 0;
let speed = 0.4;

let obstacles = [];
let coinObjects = [];

function init3D() {
  const container = document.getElementById('canvas-container');
  
  // Scene Setup
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

  // Perspective Camera
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);
  camera.lookAt(0, 2, -10);

  // Renderer Setup
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
  dirLight.position.set(20, 40, 20);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Ground & Railway Tracks
  createEnvironment();

  // Create Player with Hoverboard
  createPlayer();

  window.addEventListener('resize', onWindowResize);
}

function createEnvironment() {
  // Grass Ground
  const grassGeo = new THREE.PlaneGeometry(100, 1000);
  const grassMat = new THREE.MeshLambertMaterial({ color: 0x55aa33 });
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.rotation.x = -Math.PI / 2;
  grass.position.z = -400;
  grass.receiveShadow = true;
  scene.add(grass);

  // Main Track Bed
  const trackGeo = new THREE.PlaneGeometry(12, 1000);
  const trackMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
  const tracks = new THREE.Mesh(trackGeo, trackMat);
  tracks.rotation.x = -Math.PI / 2;
  tracks.position.y = 0.01;
  tracks.position.z = -400;
  tracks.receiveShadow = true;
  scene.add(tracks);

  // Steel Rails
  [-3.5, 0, 3.5].forEach(x => {
    [-0.8, 0.8].forEach(offset => {
      const railGeo = new THREE.BoxGeometry(0.15, 0.2, 1000);
      const railMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 });
      const rail = new THREE.Mesh(railGeo, railMat);
      rail.position.set(x + offset, 0.1, -400);
      scene.add(rail);
    });
  });
}

function createHoverboard() {
  const boardGroup = new THREE.Group();

  // Hoverboard Deck
  const deckGeo = new THREE.BoxGeometry(1.2, 0.15, 3.2);
  const deckMat = new THREE.MeshStandardMaterial({ color: 0xff3131, metalness: 0.6, roughness: 0.2 });
  const deck = new THREE.Mesh(deckGeo, deckMat);
  boardGroup.add(deck);

  // Glowing Thruster Outline
  const glowGeo = new THREE.BoxGeometry(1.3, 0.1, 3.0);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.y = -0.05;
  boardGroup.add(glow);

  boardGroup.position.set(0, -0.8, 0);
  boardGroup.visible = false;
  return boardGroup;
}

function createPlayer() {
  player = new THREE.Group();

  // Character Body
  const bodyGeo = new THREE.BoxGeometry(1.2, 2, 1);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3131 });
  playerMesh = new THREE.Mesh(bodyGeo, bodyMat);
  playerMesh.position.y = 1;
  playerMesh.castShadow = true;
  player.add(playerMesh);

  // Head
  const headGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.set(0, 2.3, 0);
  head.castShadow = true;
  player.add(head);

  // Attach Hoverboard
  hoverboard = createHoverboard();
  player.add(hoverboard);

  player.position.set(laneX[1], 0, 0);
  scene.add(player);
}

function createTrain(zPos, lane) {
  const trainGroup = new THREE.Group();

  // Train Body
  const bodyGeo = new THREE.BoxGeometry(2.8, 3.5, 12);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd92338, metalness: 0.3 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.75;
  body.castShadow = true;
  body.receiveShadow = true;
  trainGroup.add(body);

  // Windshield
  const glassGeo = new THREE.BoxGeometry(2.4, 1.2, 0.1);
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x70a1ff });
  const glass = new THREE.Mesh(glassGeo, glassMat);
  glass.position.set(0, 2.5, 6.01);
  trainGroup.add(glass);

  // "THAKUR ADITYA" Canvas Texture
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffde59';
  ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#000000';
  ctx.font = 'bold 22px Arial';
  ctx.textAlign = 'center';
  ctx.fillText("THAKUR ADITYA", 128, 40);

  const textTexture = new THREE.CanvasTexture(canvas);
  const textGeo = new THREE.PlaneGeometry(2.4, 0.6);
  const textMat = new THREE.MeshBasicMaterial({ map: textTexture });
  const textMesh = new THREE.Mesh(textGeo, textMat);
  textMesh.position.set(0, 1.4, 6.02);
  trainGroup.add(textMesh);

  trainGroup.position.set(laneX[lane], 0, zPos);
  scene.add(trainGroup);
  obstacles.push({ mesh: trainGroup, type: 'train', lane: lane });
}

function createCoin(zPos, lane) {
  const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.2, 16);
  const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
  const coin = new THREE.Mesh(coinGeo, coinMat);
  coin.rotation.x = Math.PI / 2;
  coin.position.set(laneX[lane], 1.2, zPos);
  coin.castShadow = true;
  scene.add(coin);
  coinObjects.push(coin);
}

// Input Control Listeners
window.addEventListener('keydown', (e) => {
  if (!isPlaying) return;
  if ((e.key === 'ArrowLeft' || e.key === 'a') && activeLane > 0) activeLane--;
  if ((e.key === 'ArrowRight' || e.key === 'd') && activeLane < 2) activeLane++;
  if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping) {
    isJumping = true;
    jumpVelocity = 0.25;
  }
  if ((e.key === 'ArrowDown' || e.key === 's') && !isSliding) {
    isSliding = true;
    slideTimer = 30;
    playerMesh.scale.set(1, 0.5, 1);
  }
});

// Activate Hoverboard on Double Click
window.addEventListener('dblclick', activateHoverboard);

function activateHoverboard() {
  if (!isPlaying || isHovering) return;
  isHovering = true;
  hoverTimer = 300; // ~5 seconds duration
  hoverboard.visible = true;
  playerMesh.position.y = 1.4;
}

function spawnObjects() {
  if (Math.random() < 0.03) {
    const lane = Math.floor(Math.random() * 3);
    createTrain(-100, lane);
  }
  if (Math.random() < 0.05) {
    const lane = Math.floor(Math.random() * 3);
    createCoin(-100, lane);
  }
}

function update() {
  if (!isPlaying) return;

  // Smooth Lateral Lane Movement
  player.position.x += (laneX[activeLane] - player.position.x) * 0.2;

  // Jump Physics
  if (isJumping) {
    player.position.y += jumpVelocity;
    jumpVelocity -= 0.015;
    if (player.position.y <= 0) {
      player.position.y = 0;
      isJumping = false;
    }
  }

  // Slide Logic
  if (isSliding) {
    slideTimer--;
    if (slideTimer <= 0) {
      isSliding = false;
      playerMesh.scale.set(1, 1, 1);
    }
  }

  // Hoverboard Motion & Expiration
  if (isHovering) {
    hoverTimer--;
    hoverboard.rotation.z = Math.sin(Date.now() * 0.01) * 0.1;
    if (hoverTimer <= 0) {
      isHovering = false;
      hoverboard.visible = false;
      playerMesh.position.y = 1;
    }
  }

  // Obstacle Collision Logic
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.mesh.position.z += speed;

    if (Math.abs(obs.mesh.position.z - player.position.z) < 2.5 && obs.lane === activeLane) {
      if (player.position.y < 2.5) {
        if (isHovering) {
          // Hoverboard acts as a crash shield
          isHovering = false;
          hoverTimer = 0;
          hoverboard.visible = false;
          playerMesh.position.y = 1;
          scene.remove(obs.mesh);
          obstacles.splice(i, 1);
          continue;
        } else {
          gameOver();
        }
      }
    }

    if (obs.mesh.position.z > 15) {
      scene.remove(obs.mesh);
      obstacles.splice(i, 1);
    }
  }

  // Coin Collection Logic
  for (let i = coinObjects.length - 1; i >= 0; i--) {
    let coin = coinObjects[i];
    coin.position.z += speed;
    coin.rotation.z += 0.05;

    if (Math.abs(coin.position.z - player.position.z) < 1.5 && Math.abs(coin.position.x - player.position.x) < 1) {
      coins++;
      coinSound.currentTime = 0;
      coinSound.play().catch(()=>{});
      document.getElementById('coins').textContent = coins;
      scene.remove(coin);
      coinObjects.splice(i, 1);
    } else if (coin.position.z > 15) {
      scene.remove(coin);
      coinObjects.splice(i, 1);
    }
  }

  score += 1;
  document.getElementById('score').textContent = Math.floor(score / 5);

  spawnObjects();
}

function animate() {
  requestAnimationFrame(animate);
  update();
  renderer.render(scene, camera);
}

function startGame() {
  isPlaying = true;
  score = 0; coins = 0;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
}

function gameOver() {
  isPlaying = false;
  crashSound.currentTime = 0;
  crashSound.play().catch(()=>{});
  document.getElementById('finalScore').textContent = Math.floor(score / 5);
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

init3D();
animate();
</script>
</body>
</html>
