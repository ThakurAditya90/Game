<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THAKUR ADITYA 3D - Realistic Runner</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }
  body { 
    background: #1a1a1a; 
    font-family: 'Arial Black', sans-serif; 
    overflow: hidden; 
    user-select: none; 
    touch-action: manipulation;
  }
  #canvas-container { 
    width: 100vw; 
    height: 100vh; 
  }
  
  /* Glassmorphic HUD */
  #hud {
    position: absolute; 
    top: 20px; 
    left: 20px; 
    right: 20px;
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    pointer-events: none; 
    z-index: 10;
  }
  .score-box, .coin-box {
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    padding: 12px 28px; 
    border-radius: 30px; 
    border: 2px solid rgba(255, 255, 255, 0.2);
    color: #fff; 
    font-size: 22px; 
    letter-spacing: 1px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
  }
  .score-box span { color: #38b6ff; }
  .coin-box span { color: #ffde59; }

  /* Touch Direction Buttons */
  #touch-controls {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 30;
  }
  .horizontal-btns { display: flex; gap: 15px; }
  .ctrl-btn {
    width: 65px;
    height: 65px;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    color: #fff;
    font-size: 24px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .ctrl-btn:active {
    background: rgba(255, 222, 89, 0.6);
    transform: scale(0.92);
  }

  /* Overlay UI Screens */
  .overlay {
    position: absolute; 
    inset: 0; 
    background: rgba(10, 10, 15, 0.8);
    backdrop-filter: blur(12px);
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    color: #fff; 
    z-index: 40;
  }
  .hidden { display: none !important; }
  h1 { 
    font-size: 52px; 
    background: linear-gradient(180deg, #ffde59, #ff914d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px; 
    text-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  p { font-size: 16px; margin-bottom: 10px; color: #ddd; text-align: center; }
  
  button.action-btn {
    background: linear-gradient(135deg, #ff3131, #ff914d);
    color: #fff; 
    border: none; 
    padding: 16px 45px; 
    font-size: 22px;
    font-weight: bold; 
    border-radius: 40px; 
    cursor: pointer; 
    margin-top: 25px;
    box-shadow: 0 10px 25px rgba(255, 49, 49, 0.4);
    transition: transform 0.2s;
  }
  button.action-btn:active { transform: scale(0.95); }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<!-- Glass HUD -->
<div id="hud">
  <div class="score-box">SCORE <span id="score">0</span></div>
  <div class="coin-box">🪙 <span id="coins">0</span></div>
</div>

<!-- Touch Directional Controls -->
<div id="touch-controls">
  <button id="btn-up" class="ctrl-btn">▲</button>
  <div class="horizontal-btns">
    <button id="btn-left" class="ctrl-btn">◀</button>
    <button id="btn-down" class="ctrl-btn">▼</button>
    <button id="btn-right" class="ctrl-btn">▶</button>
  </div>
</div>

<!-- Start Overlay Screen -->
<div id="startScreen" class="overlay">
  <h1>THAKUR ADITYA</h1>
  <p>Sunset Realistic Runner</p>
  <p style="color:#ffde59;"><b>Double-Tap / Double-Click screen for HOVERBOARD shield!</b></p>
  <button id="startBtn" class="action-btn">START RUN</button>
</div>

<!-- Game Over Overlay Screen -->
<div id="gameOverScreen" class="overlay hidden">
  <h1 style="background: linear-gradient(180deg, #ff3131, #8b0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">BUSTED!</h1>
  <p>Final Score: <span id="finalScore">0</span></p>
  <button id="restartBtn" class="action-btn">TRY AGAIN</button>
</div>

<script>
// Sound Elements Setup
const crashSound = new Audio('crash.mp3');
const coinSound = new Audio('coin.mp3');
const hoverboardSound = new Audio('Hoverboard.mp3');

// Background Music Setup (50% Volume, Looping)
const bgMusic1 = new Audio('background1.mp3');
const bgMusic2 = new Audio('background2.mp3');
bgMusic1.volume = 0.5;
bgMusic1.loop = true;
bgMusic2.volume = 0.5;
bgMusic2.loop = true;
let currentBgMusic = null;

// Three.js Engine Variables
let scene, camera, renderer;
let player, playerBody, leftLeg, rightLeg, leftArm, rightArm, hoverboard;

let activeLane = 1;
const laneX = [-3.5, 0, 3.5];

let isJumping = false;
let jumpVelocity = 0;
let isSliding = false;
let slideTimer = 0;
let isHovering = false;
let hoverTimer = 0;
let isPlaying = false;

let score = 0;
let coins = 0;
let speed = 0.42;
let lastCoinSpawnTime = 0; // Timer for 1 coin every 2 seconds

let obstacles = [];
let coinObjects = [];
let sceneryObjects = [];

let touchStartX = 0, touchStartY = 0, lastTapTime = 0;

function init3D() {
  const container = document.getElementById('canvas-container');
  
  // Sunset Scene & Atmospheric Horizon Fog
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xfd7e14); 
  scene.fog = new THREE.FogExp2(0xd9480f, 0.011);

  // Perspective Camera
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);

  // Realistic Renderer Setup
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  // Lighting Architecture (Sunset Warmth)
  const ambientLight = new THREE.AmbientLight(0x4a154b, 0.8);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xff922b, 2.2);
  sunLight.position.set(20, 30, -50);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far = 150;
  sunLight.shadow.bias = -0.0005;
  scene.add(sunLight);

  // Environment & Player Creation
  createRealisticEnvironment();
  createPlayer();

  // Controls & Window Event Listeners
  window.addEventListener('resize', onWindowResize);
  window.addEventListener('keydown', handleKeyDown);
  window.addEventListener('dblclick', activateHoverboard);
  window.addEventListener('touchstart', handleTouchStart);
  window.addEventListener('touchend', handleTouchEnd);

  setupButtonControls();
}

function setupButtonControls() {
  document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (isPlaying && activeLane > 0) activeLane--; });
  document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (isPlaying && activeLane < 2) activeLane++; });
  document.getElementById('btn-up').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (isPlaying && !isJumping) { isJumping = true; jumpVelocity = 0.28; } });
  document.getElementById('btn-down').addEventListener('pointerdown', (e) => { e.stopPropagation(); if (isPlaying && !isSliding) { isSliding = true; slideTimer = 30; playerBody.scale.set(1, 0.5, 1); } });
}

function createRealisticEnvironment() {
  // Ground
  const grassGeo = new THREE.PlaneGeometry(150, 1000);
  const grassMat = new THREE.MeshStandardMaterial({ color: 0x3a5a40, roughness: 0.9 });
  const grass = new THREE.Mesh(grassGeo, grassMat);
  grass.rotation.x = -Math.PI / 2;
  grass.position.z = -400;
  grass.receiveShadow = true;
  scene.add(grass);

  // Track Bed
  const trackGeo = new THREE.PlaneGeometry(12, 1000);
  const trackMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.6, metalness: 0.2 });
  const tracks = new THREE.Mesh(trackGeo, trackMat);
  tracks.rotation.x = -Math.PI / 2;
  tracks.position.y = 0.01;
  tracks.position.z = -400;
  tracks.receiveShadow = true;
  scene.add(tracks);

  // Wooden Ties
  for (let z = 10; z > -800; z -= 3.5) {
    const tieGeo = new THREE.BoxGeometry(11.5, 0.12, 0.7);
    const tieMat = new THREE.MeshStandardMaterial({ color: 0x3d271d, roughness: 0.8 });
    const tie = new THREE.Mesh(tieGeo, tieMat);
    tie.position.set(0, 0.06, z);
    tie.receiveShadow = true;
    tie.castShadow = true;
    scene.add(tie);
  }

  // Metallic Rails
  [-3.5, 0, 3.5].forEach(x => {
    [-0.8, 0.8].forEach(offset => {
      const railGeo = new THREE.BoxGeometry(0.18, 0.25, 1000);
      const railMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.95, roughness: 0.1 });
      const rail = new THREE.Mesh(railGeo, railMat);
      rail.position.set(x + offset, 0.18, -400);
      rail.castShadow = true;
      scene.add(rail);
    });
  });

  // Concrete Border Walls
  [-6.5, 6.5].forEach(x => {
    const wallGeo = new THREE.BoxGeometry(0.8, 2.5, 1000);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 });
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.set(x, 1.25, -400);
    wall.receiveShadow = true;
    scene.add(wall);
  });
}

function createHoverboard() {
  const boardGroup = new THREE.Group();

  // Futuristic Aerodynamic Board
  const deckGeo = new THREE.BoxGeometry(1.2, 0.12, 3.2);
  const deckMat = new THREE.MeshStandardMaterial({ color: 0xff0044, metalness: 0.8, roughness: 0.2 });
  const deck = new THREE.Mesh(deckGeo, deckMat);
  boardGroup.add(deck);

  // Blue Neon Underglow Ring
  const glowGeo = new THREE.BoxGeometry(1.3, 0.08, 3.0);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.y = -0.05;
  boardGroup.add(glow);

  boardGroup.position.set(0, -0.85, 0);
  boardGroup.visible = false;
  return boardGroup;
}

function createPlayer() {
  player = new THREE.Group();

  // Torso (Red & White Hoodie)
  const bodyGeo = new THREE.BoxGeometry(1.1, 1.3, 0.7);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.4 });
  playerBody = new THREE.Mesh(bodyGeo, bodyMat);
  playerBody.position.y = 1.55;
  playerBody.castShadow = true;
  player.add(playerBody);

  // White Hoodie Vest Stripe
  const stripeGeo = new THREE.BoxGeometry(0.5, 1.25, 0.72);
  const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
  const stripe = new THREE.Mesh(stripeGeo, stripeMat);
  stripe.position.y = 1.55;
  player.add(stripe);

  // Head
  const headGeo = new THREE.BoxGeometry(0.75, 0.75, 0.75);
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
  const head = new THREE.Mesh(headGeo, skinMat);
  head.position.set(0, 2.6, 0);
  head.castShadow = true;
  player.add(head);

  // Backwards Blue Snapback Cap
  const capGeo = new THREE.BoxGeometry(0.8, 0.3, 0.85);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x1a73e8, roughness: 0.4 });
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.position.set(0, 2.95, 0);
  cap.castShadow = true;
  player.add(cap);

  const visorGeo = new THREE.BoxGeometry(0.75, 0.08, 0.45);
  const visor = new THREE.Mesh(visorGeo, capMat);
  visor.position.set(0, 2.9, 0.55);
  visor.castShadow = true;
  player.add(visor);

  // Legs & Denim Pants
  const legGeo = new THREE.BoxGeometry(0.36, 0.95, 0.36);
  const jeansMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.5 });

  leftLeg = new THREE.Mesh(legGeo, jeansMat);
  leftLeg.position.set(-0.32, 0.5, 0);
  leftLeg.castShadow = true;
  player.add(leftLeg);

  rightLeg = new THREE.Mesh(legGeo, jeansMat);
  rightLeg.position.set(0.32, 0.5, 0);
  rightLeg.castShadow = true;
  player.add(rightLeg);

  // Sneakers
  const shoeGeo = new THREE.BoxGeometry(0.4, 0.3, 0.6);
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
  
  const leftShoe = new THREE.Mesh(shoeGeo, shoeMat);
  leftShoe.position.set(0, -0.4, -0.1);
  leftLeg.add(leftShoe);

  const rightShoe = new THREE.Mesh(shoeGeo, shoeMat);
  rightShoe.position.set(0, -0.4, -0.1);
  rightLeg.add(rightShoe);

  // Arms
  const armGeo = new THREE.BoxGeometry(0.34, 0.9, 0.34);
  const armMat = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.4 });

  leftArm = new THREE.Mesh(armGeo, armMat);
  leftArm.position.set(-0.78, 1.55, 0);
  leftArm.castShadow = true;
  player.add(leftArm);

  rightArm = new THREE.Mesh(armGeo, armMat);
  rightArm.position.set(0.78, 1.55, 0);
  rightArm.castShadow = true;
  player.add(rightArm);

  // Hoverboard Attachment
  hoverboard = createHoverboard();
  player.add(hoverboard);

  player.position.set(laneX[1], 0, 0);
  scene.add(player);
}

function createTree(zPos, xPos) {
  const treeGroup = new THREE.Group();

  const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3.5, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a2c11, roughness: 0.9 });
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  trunk.position.y = 1.75;
  trunk.castShadow = true;
  treeGroup.add(trunk);

  const leavesGeo = new THREE.DodecahedronGeometry(2.2, 1);
  const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.6 });
  const leaves = new THREE.Mesh(leavesGeo, leavesMat);
  leaves.position.y = 4.2;
  leaves.castShadow = true;
  treeGroup.add(leaves);

  treeGroup.position.set(xPos, 0, zPos);
  scene.add(treeGroup);
  sceneryObjects.push(treeGroup);
}

function createTrain(zPos, lane) {
  const trainGroup = new THREE.Group();

  // Train Body
  const bodyGeo = new THREE.BoxGeometry(2.9, 3.7, 13.5);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xb71c1c, metalness: 0.5, roughness: 0.2 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.85;
  body.castShadow = true;
  body.receiveShadow = true;
  trainGroup.add(body);

  // Windshield Glass
  const glassGeo = new THREE.BoxGeometry(2.5, 1.3, 0.1);
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 });
  const glass = new THREE.Mesh(glassGeo, glassMat);
  glass.position.set(0, 2.7, 6.76);
  trainGroup.add(glass);

  // Headlights
  [-0.9, 0.9].forEach(x => {
    const lightGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.1, 16);
    const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const headlight = new THREE.Mesh(lightGeo, lightMat);
    headlight.rotation.x = Math.PI / 2;
    headlight.position.set(x, 0.8, 6.76);
    trainGroup.add(headlight);
  });

  // Front Branding Canvas (THAKUR ADITYA)
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffde59';
  ctx.fillRect(0, 0, 512, 128);
  ctx.fillStyle = '#000000';
  ctx.font = 'bold 42px Arial';
  ctx.textAlign = 'center';
  ctx.fillText("THAKUR ADITYA", 256, 80);

  const textTexture = new THREE.CanvasTexture(canvas);
  const textGeo = new THREE.PlaneGeometry(2.4, 0.6);
  const textMat = new THREE.MeshBasicMaterial({ map: textTexture });
  const textMesh = new THREE.Mesh(textGeo, textMat);
  textMesh.position.set(0, 1.6, 6.77);
  trainGroup.add(textMesh);

  trainGroup.position.set(laneX[lane], 0, zPos);
  scene.add(trainGroup);
  obstacles.push({ mesh: trainGroup, type: 'train', lane: lane });
}

function createCoin(zPos, lane) {
  const coinGeo = new THREE.CylinderGeometry(0.65, 0.65, 0.15, 24);
  const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.95, roughness: 0.1 });
  const coin = new THREE.Mesh(coinGeo, coinMat);
  coin.rotation.x = Math.PI / 2;
  coin.position.set(laneX[lane], 1.2, zPos);
  coin.castShadow = true;
  scene.add(coin);
  coinObjects.push(coin);
}

// Spawning Logic Engine
function spawnWorldObjects() {
  // Train Traffic Spawning
  if (Math.random() < 0.008) {
    const lane = Math.floor(Math.random() * 3);
    const lastTrain = obstacles[obstacles.length - 1];
    if (!lastTrain || lastTrain.mesh.position.z > -70) {
      createTrain(-120, lane);
    }
  }

  // EXACTLY 1 COIN EVERY 2 SECONDS (2000 ms)
  const currentTime = Date.now();
  if (currentTime - lastCoinSpawnTime >= 2000) {
    const lane = Math.floor(Math.random() * 3);
    createCoin(-120, lane);
    lastCoinSpawnTime = currentTime;
  }

  // Trees Spawning
  if (Math.random() < 0.04) {
    const side = Math.random() < 0.5 ? -10 : 10;
    createTree(-120, side);
  }
}

// Keyboard Controls
function handleKeyDown(e) {
  if (!isPlaying) return;
  const key = e.key.toLowerCase();
  if ((key === 'arrowleft' || key === 'a') && activeLane > 0) activeLane--;
  if ((key === 'arrowright' || key === 'd') && activeLane < 2) activeLane++;
  if ((key === 'arrowup' || key === 'w' || key === ' ') && !isJumping) { isJumping = true; jumpVelocity = 0.28; }
  if ((key === 'arrowdown' || key === 's') && !isSliding) { isSliding = true; slideTimer = 30; playerBody.scale.set(1, 0.5, 1); }
}

// Touch Gestures & Double-Tap Hoverboard
function handleTouchStart(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  const currentTime = new Date().getTime();
  if (currentTime - lastTapTime < 300) activateHoverboard();
  lastTapTime = currentTime;
}

function handleTouchEnd(e) {
  if (!isPlaying) return;
  const diffX = e.changedTouches[0].clientX - touchStartX;
  const diffY = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(diffX) > Math.abs(diffY)) {
    if (diffX > 30 && activeLane < 2) activeLane++;
    else if (diffX < -30 && activeLane > 0) activeLane--;
  } else {
    if (diffY < -30 && !isJumping) { isJumping = true; jumpVelocity = 0.28; }
    else if (diffY > 30 && !isSliding) { isSliding = true; slideTimer = 30; playerBody.scale.set(1, 0.5, 1); }
  }
}

// Hoverboard Activation (5.3s Shield)
function activateHoverboard() {
  if (!isPlaying || isHovering) return;
  isHovering = true;
  hoverTimer = 320; // 320 frames / 60 FPS = 5.33 seconds
  hoverboard.visible = true;
  playerBody.position.y = 1.9;
  hoverboardSound.currentTime = 0;
  hoverboardSound.play().catch(() => {});
}

// Frame Loop Logic
function update() {
  if (!isPlaying) return;

  // Smooth Horizontal Lane Movement
  player.position.x += (laneX[activeLane] - player.position.x) * 0.25;

  // Running Gait Animation & Subtle Camera Movement
  if (!isJumping && !isSliding) {
    const time = Date.now() * 0.016;
    leftLeg.rotation.x = Math.sin(time) * 0.75;
    rightLeg.rotation.x = -Math.sin(time) * 0.75;
    leftArm.rotation.x = -Math.sin(time) * 0.75;
    rightArm.rotation.x = Math.sin(time) * 0.75;
    camera.position.y = 5 + Math.sin(time * 2) * 0.06;
  }

  // Jump Gravity Mechanics
  if (isJumping) {
    player.position.y += jumpVelocity;
    jumpVelocity -= 0.016;
    if (player.position.y <= 0) { player.position.y = 0; isJumping = false; }
  }

  // Slide Timer
  if (isSliding) {
    slideTimer--;
    if (slideTimer <= 0) { isSliding = false; playerBody.scale.set(1, 1, 1); }
  }

  // Hoverboard Duration & Wobble
  if (isHovering) {
    hoverTimer--;
    hoverboard.rotation.z = Math.sin(Date.now() * 0.01) * 0.15;
    if (hoverTimer <= 0) { isHovering = false; hoverboard.visible = false; playerBody.position.y = 1.6; }
  }

  // Obstacle Collision Detection
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.mesh.position.z += speed;

    if (Math.abs(obs.mesh.position.z - player.position.z) < 2.5 && obs.lane === activeLane) {
      if (player.position.y < 2.5) {
        if (isHovering) {
          // Hoverboard acts as shield
          isHovering = false;
          hoverTimer = 0;
          hoverboard.visible = false;
          playerBody.position.y = 1.6;
          scene.remove(obs.mesh);
          obstacles.splice(i, 1);
          continue;
        } else {
          gameOver();
        }
      }
    }
    if (obs.mesh.position.z > 15) { scene.remove(obs.mesh); obstacles.splice(i, 1); }
  }

  // Coin Collection
  for (let i = coinObjects.length - 1; i >= 0; i--) {
    let coin = coinObjects[i];
    coin.position.z += speed;
    coin.rotation.z += 0.08;

    if (Math.abs(coin.position.z - player.position.z) < 1.6 && Math.abs(coin.position.x - player.position.x) < 1.2) {
      coins++;
     coinSound.currentTime = 0;
      coinSound.play().catch(() => {});
      document.getElementById('coins').textContent = coins;
      scene.remove(coin);
      coinObjects.splice(i, 1);
    } else if (coin.position.z > 15) {
      scene.remove(coin);
      coinObjects.splice(i, 1);
    }
  }

  // Scenery Recycling
  for (let i = sceneryObjects.length - 1; i >= 0; i--) {
    let sc = sceneryObjects[i];
    sc.position.z += speed;
    if (sc.position.z > 15) { scene.remove(sc); sceneryObjects.splice(i, 1); }
  }

  score += 1;
  document.getElementById('score').textContent = Math.floor(score / 5);

  spawnWorldObjects();
}

function animate() {
  requestAnimationFrame(animate);
  update();
 renderer.render(scene, camera);
}

function resetGame() {
  obstacles.forEach(o => scene.remove(o.mesh));
  coinObjects.forEach(c => scene.remove(c));
  sceneryObjects.forEach(s => scene.remove(s));
  obstacles = []; coinObjects = []; sceneryObjects = [];

  activeLane = 1;
  player.position.set(laneX[1], 0, 0);
  isJumping = false; isSliding = false; isHovering = false;
  hoverboard.visible = false;
  playerBody.position.y = 1.6;
  playerBody.scale.set(1, 1, 1);

  score = 0; coins = 0; speed = 0.42;
  document.getElementById('score').textContent = "0";
  document.getElementById('coins').textContent = "0";
}

function startGame() {
  resetGame();
  isPlaying = true;
  document.getElementById('startScreen').classList.add('hidden');
 document.getElementById('gameOverScreen').classList.add('hidden');

  // Stop previous background music
  if (currentBgMusic) {
    currentBgMusic.pause();
    currentBgMusic.currentTime = 0;
  }

  // Randomly select background1.mp3 or background2.mp3
  currentBgMusic = Math.random() < 0.5 ? bgMusic1 : bgMusic2;
  currentBgMusic.currentTime = 0;
  currentBgMusic.play().catch(() => {});

  window.focus();
}

function gameOver() {
  isPlaying = false;

  // Stop background music immediately on death
  if (currentBgMusic) {
    currentBgMusic.pause();
    currentBgMusic.currentTime = 0;
  }
 crashSound.currentTime = 0;
  crashSound.play().catch(() => {});
  document.getElementById('finalScore').textContent = Math.floor(score / 5);
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

init3D();
animate();
</script>
</body>
</html>
